name: Build English ReadWrite APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create Android WebView wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apkapp/src/main/java/com/creep1020/readwrite apkapp/src/main/res/drawable
          cp icon-512.png apkapp/src/main/res/drawable/app_icon.png
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'EnglishReadWrite'
          include ':apkapp'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE
          cat > gradle.properties <<'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          GRADLE
          cat > apkapp/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.creep1020.readwrite'
            compileSdk 35
            defaultConfig {
              applicationId 'com.creep1020.readwrite'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0-apk-test'
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          GRADLE
          cat > apkapp/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application android:label="영어 읽기·쓰기" android:icon="@drawable/app_icon" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="unspecified">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > apkapp/src/main/java/com/creep1020/readwrite/MainActivity.java <<'JAVA'
          package com.creep1020.readwrite;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String HOME = "https://creep1020.github.io/ilbbang-readwrite-test/";
              private static final int MIC_REQUEST = 1001;
              private static final int FILE_REQUEST = 1002;
              private WebView web;
              private PermissionRequest pendingAudioRequest;
              private ValueCallback<Uri[]> fileCallback;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          // Keep the learning app inside the APK; open unrelated URLs outside.
                          if ("https".equals(u.getScheme()) && "creep1020.github.io".equals(u.getHost())
                              && u.getPath() != null && u.getPath().startsWith("/ilbbang-readwrite-test/")) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); }
                          catch (Exception e) { Toast.makeText(MainActivity.this, "링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              Uri origin = request.getOrigin();
                              boolean trusted = "https".equals(origin.getScheme())
                                  && "creep1020.github.io".equals(origin.getHost())
                                  ;
                              boolean wantsAudio = false;
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) wantsAudio = true;
                              }
                              if (!trusted || !wantsAudio) { request.deny(); return; }
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingAudioRequest = request;
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, MIC_REQUEST);
                              }
                          });
                      }
                      @Override public void onPermissionRequestCanceled(PermissionRequest request) {
                          if (pendingAudioRequest == request) pendingAudioRequest = null;
                      }
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(intent, FILE_REQUEST);
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });
                  if (savedInstanceState == null) web.loadUrl(HOME);
                  else web.restoreState(savedInstanceState);
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MIC_REQUEST && pendingAudioRequest != null) {
                      PermissionRequest req = pendingAudioRequest;
                      pendingAudioRequest = null;
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED)
                          req.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      else req.deny();
                  }
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                  }
              }
              @Override public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
              @Override protected void onSaveInstanceState(Bundle out) {
                  if (web != null) web.saveState(out);
                  super.onSaveInstanceState(out);
              }
              @Override protected void onDestroy() {
                  if (pendingAudioRequest != null) { pendingAudioRequest.deny(); pendingAudioRequest = null; }
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
          JAVA
      - name: Build debug APK
        run: gradle :apkapp:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-ReadWrite-APK-test
          path: apkapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

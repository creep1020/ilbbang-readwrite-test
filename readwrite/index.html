<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--green:#426a53}*{box-sizing:border-box}body{margin:0;font:15px system-ui,'Noto Sans KR',sans-serif;color:#2a302b;background:#fbf9f3}main{max-width:700px;margin:auto;padding:10px 12px 45px}.hero{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#f4efe6;border-radius:15px}.panel{border:1px solid #e6e1d6;background:white;border-radius:14px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}button,select{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid #d6dfd4;background:white;cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button.small{font-size:13px;padding:5px 11px}.sentence{border-bottom:1px solid #eee;padding:12px 0}.ko{font-size:14px;color:#777;margin-top:5px}.muted{color:#797f79;font-size:13px}.pill{background:#e9f2e8;padding:4px 9px;border-radius:20px;font-size:12px}.vrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 4px;border-bottom:1px solid #eee}.answer{color:#38694c;margin:6px 0}.quiz button{display:block;width:100%;text-align:left;margin:7px 0}.quiz .correct{background:#e2f3e5}.quiz .wrong{background:#fae8e3}h2{font-size:20px;margin:10px 0}.hide{display:none}.writing{padding:10px 0;border-bottom:1px solid #eee}img{max-width:100%}</style></head><body><main>
<div class="row"><strong>📖 영어 읽기·쓰기</strong><span id="profileLabel" class="pill">프로필 확인 중</span></div>
<div class="panel row"><label>학습 DAY <select id="day"><option value="1">DAY 1</option><option value="2">DAY 2</option></select></label><span id="doneStatus" class="muted"></span></div>
<img id="hero" class="hero" alt="오늘의 동화 삽화"><p><button id="download" class="primary">📥 전체 학습 이미지 다운로드</button></p>
<h2 id="title"></h2><p class="muted" id="subtitle"></p>
<section class="panel"><div class="row"><strong>📖 영어 이야기</strong><label><input id="showKo" type="checkbox" checked> 해석 보기</label></div><div id="story"></div></section>
<section class="panel"><strong>🧠 이야기 이해하기</strong><div id="quiz"></div></section>
<section class="panel"><strong>✏️ 영작 5문제</strong><p class="muted">공책에 직접 쓰고 정답을 확인하세요.</p><div id="writing"></div></section>
<section class="panel"><strong>🔄 불규칙동사 복습</strong><div id="verbs"></div></section>
<section class="panel"><strong>✨ 오늘의 새 표현</strong><div id="vocab"></div></section>
<section class="panel"><strong>⭐ 학습 완료</strong><p class="muted">읽기·쓰기 완료 기록은 프로필별로 별도 저장돼요. 기존 일빵빵 완료 기록과 별 보상은 변경하지 않아요.</p><button class="primary" id="done">오늘 학습 완료하기</button><p id="doneMsg"></p></section>
</main><script>
const $=id=>document.getElementById(id);let lessons=[],profile={id:'preview',name:'지우'},activeVoice=null,voiceButton=null,voiceSeq=0;
const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persona(){const n=profile.name.trim();if(n==='지우'||n==='뀨'||n==='Jiwoo')return 'jiwoo';if(n==='민서'||n==='Minseo')return 'minseo';const d=Number($('day').value);const key='rwStoryChoiceV1:'+profile.id+':'+d;let v=localStorage.getItem(key);if(v!=='jiwoo'&&v!=='minseo'){v=Math.random()<0.5?'jiwoo':'minseo';localStorage.setItem(key,v)}return v}
function localize(s,p,day){if(p==='jiwoo')return s;let t=s.replace(/Jiwoo/g,'Minseo').replace(/지우/g,'민서');if(day===1){t=t.replace(/^She saw Mina/,'He saw Mina').replace(/She smiled at Minseo/,'Mina smiled at Minseo').replace('for her, too','for him, too');}return t}
function stopVoice(){voiceSeq++;if('speechSynthesis' in window)speechSynthesis.cancel();if(voiceButton){voiceButton.textContent='🔊 듣기';voiceButton=null}}
function speak(i,btn){if(voiceButton===btn){stopVoice();return}stopVoice();if(!('speechSynthesis' in window)){alert('음성 읽기를 지원하지 않는 환경입니다.');return}const seq=voiceSeq;const day=Number($('day').value);const text=localize(lessons[day-1].story[i][0],persona(),day);let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.5;u.onend=u.onerror=()=>{if(seq===voiceSeq){btn.textContent='🔊 듣기';voiceButton=null}};voiceButton=btn;btn.textContent='■ 중지';speechSynthesis.speak(u)}
function render(){if(!lessons.length)return;stopVoice();const day=Number($('day').value),p=persona(),l=lessons[day-1],name=p==='jiwoo'?'Jiwoo':'Minseo';$('profileLabel').textContent=profile.name+' · '+(p==='jiwoo'?'지우':'민서')+' 이야기';$('hero').src='images/'+p+day+'.jpg';$('hero').onerror=()=>{$('hero').alt='삽화 파일을 확인해 주세요.'};$('download').onclick=()=>{const a=document.createElement('a');a.href='images/'+p+day+'_study.png';a.download='DAY'+day+'_'+name+'_study.png';document.body.append(a);a.click();a.remove()};$('title').textContent='DAY '+day+' · '+(day===1?name+"'s Little Surprise":name+' and the Heart Card');$('subtitle').textContent=day===1?'작은 깜짝 선물':'하트 카드';
$('story').innerHTML=l.story.map((x,i)=>'<div class="sentence"><b>'+(i+1)+'. '+safe(localize(x[0],p,day))+'</b><div class="ko">'+safe(localize(x[1],p,day))+'</div><button class="small" data-s="'+i+'">🔊 듣기</button></div>').join('');$('story').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(+b.dataset.s,b));$('showKo').onchange=()=>document.querySelectorAll('.ko').forEach(el=>el.style.display=$('showKo').checked?'':'none');$('showKo').onchange();
$('quiz').innerHTML=l.qs.map((q,i)=>'<div class="sentence quiz"><b>'+(i+1)+'. '+safe(localize(q[0],p,day))+'</b>'+q[1].map((o,j)=>'<button data-q="'+i+'" data-a="'+j+'">'+safe(localize(o,p,day))+'</button>').join('')+'<div id="feedback'+i+'" class="muted"></div></div>').join('');$('quiz').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q,ans=+b.dataset.a,correct=l.qs[q][2];$('feedback'+q).textContent=ans===correct?'정답이에요!':'다시 생각해 보세요.';b.classList.add(ans===correct?'correct':'wrong')});
$('writing').innerHTML=l.ws.map((x,i)=>'<div class="writing"><b>'+(i+1)+'. '+safe(localize(x[0],p,day))+'</b><div id="ans'+i+'" class="answer hide">'+safe(localize(x[1],p,day))+'</div><button class="small" data-w="'+i+'">정답 확인</button></div>').join('');$('writing').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{let el=$('ans'+b.dataset.w);el.classList.toggle('hide');b.textContent=el.classList.contains('hide')?'정답 확인':'정답 숨기기'});
$('verbs').innerHTML=l.verbs.map(v=>'<div class="vrow"><b>'+safe(v.slice(0,3).join(' → '))+'</b><span>'+safe(v[3]+' → '+v[4])+'</span></div>').join('');$('vocab').innerHTML=l.vocab.map(v=>'<div class="vrow"><b>'+safe(v[0])+'</b><span>'+safe(v[1])+'</span></div>').join('');const key='rwCompletedV1:'+profile.id+':'+day;$('doneStatus').textContent=localStorage.getItem(key)?'✓ 완료':'학습 전';$('doneMsg').textContent='';$('done').onclick=()=>{localStorage.setItem(key,new Date().toISOString());$('doneStatus').textContent='✓ 완료';$('doneMsg').textContent='완료 기록이 저장됐어요.'}}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='ILBBANG_RW_PROFILE'&&e.data.id){profile={id:String(e.data.id),name:String(e.data.name||'프로필')};render()}});$('day').onchange=render;fetch('lessons.json').then(r=>r.json()).then(d=>{lessons=d;render();parent.postMessage({type:'ILBBANG_RW_READY'},'*')}).catch(e=>{document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px;color:red">학습 자료를 읽을 수 없습니다. 크롬에서 웹 주소로 열어 주세요.</p>');console.error(e)});
</script></body></html>
